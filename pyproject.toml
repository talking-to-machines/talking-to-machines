# ─── Build system ─────────────────────────────────────────────────────────────
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

# ─── Project metadata ─────────────────────────────────────────────────────────
[project] 
name = "talkingtomachines" 
version = "0.3.2"
description = "A python package for conducting AI-AI experiments for social science research." 
readme = {file = "README.md", content-type = "text/markdown"} 
requires-python = ">=3.12" 
license = {file = "LICENSE"}
authors = [
  { name = "Raymond Low", email = "raymond.low@nuffield.ox.ac.uk" },
  { name = "Raymond Duch", email = "raymond.duch@nuffield.ox.ac.uk" },
  { name = "Tommaso Batistoni", email = "tommaso.batistoni@nuffield.ox.ac.uk" },
]
dependencies = [
  "click>=8.0.0",
  "python-dotenv>=0.19",
  "pandas>=2.2",
  "numpy>=2.0,<3",
  "requests>=2.28,<3",
  "scikit-learn>=1.4,<2",
  "nltk>=3.8,<4",
  "openai>=1.37,<2",
  "openpyxl>=3.1.5",
  "Jinja2>=3.0.0",
  "httpx>=0.28,<1",
  "truststore>=0.9",
  # New providers (Phase 4)
  "anthropic>=0.40",
  "google-genai>=0.8",
  "mistralai>=1.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools]
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/talking-to-machines/talking-to-machines"

[tool.setuptools.packages.find]
where = ["."]
include = ["talkingtomachines*"]  # the real library & its subpackages
exclude = ["demos*", "storage*", "experiment_results*"]  # examples / data folders, not code

[project.scripts]
talkingtomachines = "talkingtomachines.cli:main"